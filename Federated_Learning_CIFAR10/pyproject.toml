[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-cifar10-flower"
version = "1.0.0"
description = "Federated CIFAR-10 image classification with PyTorch and Flower"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "imohammed1952"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
fraction-evaluate = 0.5
local-epochs = 5
learning-rate = 0.01
batch-size = 32
